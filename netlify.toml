# Netlify konfigurácia pre adlify-web
# Dokumentácia: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Branch deploy pre dev — preview na dev--adlifyweb.netlify.app
[context.dev]
  command = "npm run build"

# Deploy preview pre PR
[context.deploy-preview]
  command = "npm run build"

# Production (main) — adlifyweb.netlify.app
[context.production]
  command = "npm run build"

[functions]
  # Node 20 runtime pre fetch() native podporu
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
